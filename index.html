<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2E4D3" />
    <meta name="description" content="VORM — trainingsschema's, voeding en voortgang voor personal trainers en boutique studio's" />
    <!-- "Zet op beginscherm" (iOS): zonder deze tags kiest iOS zelf een statusbalkstijl voor de
         standalone-app, en dat viel niet altijd samen met hoe onze CSS de veilige zone (env(safe-area-inset-top))
         gebruikt — content kon dan over de statusbalk/Dynamic Island heen vallen. black-translucent
         maakt expliciet dat de pagina edge-to-edge tekent en zelf de veilige zone aanhoudt, zoals de rest
         van de app al doet. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VORM" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/app-icon.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/app-icon.svg" />
    <title>VORM</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

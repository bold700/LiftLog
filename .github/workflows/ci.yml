name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Handmatig te starten om de regels alsnog uit te rollen, ook als ze in geen enkele push zijn
  # veranderd — bijvoorbeeld als de database achterloopt op wat er al in de repo staat.
  workflow_dispatch:
    inputs:
      deploy_rules:
        description: 'Firestore- en storage-regels uitrollen, ook zonder wijziging'
        type: boolean
        default: false

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
        env:
          # Placeholder-config: de build heeft geen echte Firebase-sleutels nodig.
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci
          VITE_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1'
          VITE_FIREBASE_APP_ID: '1:1:web:1'

  firestore-rules:
    name: Firestore-regels (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm ci
      - run: npm run test:rules

  # De Firestore-regels staan in de repo, maar Vercel rolt ze niet uit: dat is een aparte stap bij
  # Firebase. Zolang die met de hand moest, liep de database achter op de code — regels voor nieuwe
  # collecties (check-ins, berichten) stonden er wel in maar golden niet. Daarom gebeurt het hier,
  # bij een merge naar main, en alleen als de regelbestanden zijn veranderd.
  deploy-rules:
    name: Firestore- en storage-regels uitrollen
    needs: [check, firestore-rules]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Twee commits, zodat we kunnen zien of de regels in deze push zijn veranderd.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Zijn de regels veranderd?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Handmatig gestart: uitrollen ongeacht wijzigingen."
            echo "yes=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -qE '^(firestore|storage)\.rules$'; then
            echo "Regelbestanden gewijzigd in deze push."
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Geen wijziging in firestore.rules of storage.rules; niets uit te rollen."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      # Het service-account is hetzelfde JSON-blok dat de serverless functies al gebruiken.
      # Ontbreekt de secret, dan stopt deze stap zonder de build rood te maken: dan is er simpelweg
      # nog niets ingesteld en blijft uitrollen handwerk.
      - name: Service-account klaarzetten
        id: auth
        if: steps.changed.outputs.yes == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT ontbreekt; regels zijn NIET uitgerold."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          project="$(node -e "const p=require(process.env.RUNNER_TEMP+'/service-account.json'); if(!p.project_id){console.error('Geen project_id in het service-account.');process.exit(1)} process.stdout.write(p.project_id)")"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Firestore en storage apart, en in deze volgorde. Samen in één aanroep controleert de CLI
      # eerst of de storage-API aanstaat, en struikelt daarover als het service-account dat niet
      # mag opvragen — waarna de Firestore-regels niet eens aan de beurt komen. Juist die zijn
      # nodig voor check-ins, berichten en logs.
      - name: Firestore-regels uitrollen
        id: firestore
        if: steps.auth.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules \
            --project "${{ steps.auth.outputs.project }}" \
            --non-interactive

      # Struikelt het uitrollen over een 403, dan ligt het bijna altijd aan een ontbrekende rol en
      # niet aan de regels zelf. Die uitleg hoort in de job te staan, niet in iemands hoofd.
      - name: Wat te doen bij 403
        if: failure() && steps.firestore.outcome == 'failure'
        run: |
          echo "::warning::Ging dit mis op HTTP Error 403 bij firebaserules.googleapis.com? Geef het service-account (firebase-adminsdk-...@${{ steps.auth.outputs.project }}.iam.gserviceaccount.com) in Google Cloud - IAM de rol 'Firebase Rules Admin'. Zie docs/ROLLEN-EN-RECHTEN.md."

      # De storage-regels veranderen zelden en hangen aan een extra recht dat het service-account
      # niet standaard heeft (serviceusage.services.get). Struikelt dit, dan blijft het bij een
      # waarschuwing: de Firestore-regels staan dan al goed en dát is wat de app tegenhoudt.
      # Wie dit ook automatisch wil: geef het service-account in Google Cloud IAM de rol
      # "Service Usage Consumer".
      - name: Storage-regels uitrollen
        if: steps.auth.outputs.ok == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only storage:rules \
            --project "${{ steps.auth.outputs.project }}" \
            --non-interactive
